name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Read-only token by default; only the release job may write.
permissions:
  contents: read

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
      - run: npm ci
      # CI=true makes the dmg bundler skip the Finder AppleScript step, which fails on headless runners.
      - run: npx tauri build --target universal-apple-darwin --bundles app,dmg
        env:
          CI: 'true'
      - name: Verify universal binary
        run: lipo -info "src-tauri/target/universal-apple-darwin/release/bundle/macos/Firebase Editor Pro.app/Contents/MacOS/firebase-editor-pro"
      - uses: actions/upload-artifact@v7
        with:
          name: macos-universal-dmg
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
      - run: npm ci
      - run: npx tauri build --bundles nsis
      - uses: actions/upload-artifact@v7
        with:
          name: windows-nsis-exe
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  draft-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist-artifacts
          merge-multiple: true
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: gh release create "$TAG" dist-artifacts/* --repo "$REPO" --draft --title "$TAG" --generate-notes
